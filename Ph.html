<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a12">
<title>Нормальная физиология — тренажёр</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a12;--card:#14141f;--line:#26263a;--tx:#ecebf5;--mut:#8a8aa3;--ac:#7c6cf8;--ac2:#e056a0;--ok:#3eded4;--no:#ff4f6d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Onest,-apple-system,Segoe UI,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:720px;margin:0 auto;padding:16px 14px 40px}
h1{font:700 17px/1.2 Unbounded,sans-serif;margin:4px 0 12px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.chips,.tabs,.topics{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.topics{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chip{font-size:12px;padding:5px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mut)}
.chip b{color:var(--ok)}.chip.bad b{color:var(--no)}
.tab,.tp{font:500 13px Onest,sans-serif;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;white-space:nowrap}
.tabs .tab{flex:1}
.tab.on{color:#fff;border-color:var(--ac);background:rgba(124,108,248,.18)}
.tp{padding:6px 11px;border-radius:99px;font-size:12px}
.tp.on{color:#fff;border-color:var(--ac2);background:rgba(224,86,160,.16)}
.bar{height:4px;background:var(--line);border-radius:4px;margin:6px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;animation:slideUp .35s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.meta{font-size:12px;color:var(--mut);margin-bottom:8px}
h2{font:600 17px/1.4 Onest,sans-serif;margin:0 0 14px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:400 15px/1.4 Onest,sans-serif;color:var(--tx);background:#0f0f19;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.opt i{font-style:normal;font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:6px;min-width:22px;height:22px;display:grid;place-items:center;margin-top:1px}
.opt.ok{border-color:var(--ok);background:rgba(62,222,212,.1)}
.opt.no{border-color:var(--no);background:rgba(255,79,109,.1)}
.opt[disabled]{cursor:default}
.ans{border:1px solid var(--ok);background:rgba(62,222,212,.08);border-radius:12px;padding:12px;font-size:15px;line-height:1.45}
.ans small{display:block;color:var(--ok);font-size:12px;margin-bottom:4px}
.row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;font:600 14px Onest,sans-serif;border:0;border-radius:12px;padding:13px;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.btn.g{background:var(--card);border:1px solid var(--line);color:var(--mut);flex:0 0 auto;padding:13px 16px}
.big{font:700 40px Unbounded,sans-serif;margin:6px 0}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>

<script type="application/json" id="data">[{"q":"Функция это:","correct":"Специфическая деятельность клеток, тканей, органов и их систем, направленная на поддержание жизнедеятельности всего организма.","wrong":["Анатомически закрепленная совокупность органов и тканей, выполняющих общую жизненно важную задачу.","Относительное динамическое постоянство состава и свойств внутренней среды организма.","Система клеток и неклеточных структур, объединенных общностью строения и происхождения."],"t":1},{"q":"Ткань:","correct":"Система клеток и неклеточных структур, объединенных общностью строения, происхождения и выполняемых функций.","wrong":["Обособленная часть организма, имеющая определенное строение и состоящая из комплекса различных тканей.","Структурно-функциональная единица живого организма, ограниченная плазматической мембраной и содержащая ядро.","Совокупность однотипных органов, выполняющих общую функцию и связанных единой иннервацией."],"t":1},{"q":"Облегченная диффузия осуществляется:","correct":"С помощью специальных белков-переносчиков по градиенту концентрации без затраты энергии АТФ.","wrong":["Через липидный бислой по градиенту концентрации без участия белков и без затраты АТФ.","С помощью белков-переносчиков против градиента концентрации с затратой энергии АТФ.","Путем образования мембранных пузырьков (везикул) с захватом крупных частиц и затратой энергии."],"t":1},{"q":"Физиологическая система – это:","correct":"Анатомически и генетически закрепленная совокупность органов и тканей, выполняющих общую жизненно важную функцию (например, пищеварительная, дыхательная).","wrong":["Временное динамическое объединение органов разных систем, направленное на достижение полезного приспособительного результата.","Система клеток и неклеточных структур, объединенных общностью строения, происхождения и функции.","Обособленная часть организма, состоящая из комплекса тканей и выполняющая специфическую функцию."],"t":1},{"q":"Организм:","correct":"Целостная, открытая, саморегулирующаяся и самовосстанавливающаяся живая система, взаимодействующая с внешней средой через обмен веществ и энергии.","wrong":["Совокупность клеток и неклеточных структур, объединенных общностью происхождения, строения и выполняемой функции.","Целостная открытая живая система, строение и функции которой полностью определяются внешней средой, без саморегуляции.","Относительно устойчивая совокупность органов и физиологических систем, взаимодействующая со средой только через нервную регуляцию."],"t":1},{"q":"Функциональная система – это:","correct":"Временное динамическое объединение различных органов и физиологических систем, направленное на достижение полезного для организма приспособительного результата (по П. К. Анохину).","wrong":["Анатомически и генетически закрепленная совокупность органов и тканей, выполняющих общую жизненно важную функцию.","Совокупность рефлекторных дуг, обеспечивающая безусловную реакцию организма на раздражитель (по И. П. Павлову).","Временное объединение нейронов коры, формирующее условный рефлекс на сочетание раздражителей (по А. А. Ухтомскому)."],"t":1},{"q":"Орган:","correct":"Обособленная часть организма, имеющая определенное строение, топографию и состоящая из комплекса тканей, выполняющих специфическую функцию.","wrong":["Система клеток и неклеточных структур, объединенных общностью строения, происхождения и функции.","Анатомически закрепленная совокупность разных органов, выполняющих общую жизненно важную функцию.","Временное объединение различных тканей и клеток для достижения полезного приспособительного результата."],"t":1},{"q":"Трансплантация это:","correct":"Пересадка органа, ткани или их частей с одного участка тела на другой либо от одного организма к другому.","wrong":["Полное хирургическое удаление органа или ткани для выяснения их функции в организме.","Хирургическое или химическое разобщение связей органа с центральной нервной системой.","Пропускание питательного раствора через сосуды изолированного органа для поддержания его жизнедеятельности."],"t":1},{"q":"Метод экстирпации это:","correct":"Экспериментальный метод полного хирургического удаления органа или ткани для выяснения их функции в организме.","wrong":["Пересадка органа или ткани с одного участка тела на другой для изучения их функции.","Пересечение нервов, иннервирующих орган, для выяснения нервной регуляции его функции.","Выведение протока железы на поверхность тела путем наложения фистулы для получения чистого секрета."],"t":1},{"q":"Для хронического опыта характерно:","correct":"Изучение функций в условиях сохранной целостности организма, без наркоза, в естественной обстановке и на протяжении длительного времени (часто с предварительно наложенными фистулами).","wrong":["Кратковременное наблюдение функций на наркотизированном животном сразу после операционной травмы.","Изучение функций изолированного органа, перфузируемого питательным раствором вне организма.","Моделирование функций на математических и физических моделях без использования живых объектов."],"t":1},{"q":"Адаптация:","correct":"Совокупность физиологических реакций и механизмов, обеспечивающих приспособление организма к изменяющимся условиям окружающей среды.","wrong":["Относительное динамическое постоянство внутренней среды организма и устойчивость физиологических показателей.","Совокупность реакций, приводящих к повышению порога возбуждения ткани при медленно нарастающем раздражителе.","Процесс непрерывного колебания констант организма вокруг среднего уровня под действием регуляторных механизмов."],"t":1},{"q":"Денервация это:","correct":"Хирургическое или химическое разобщение связей органа либо ткани с центральной нервной системой путем пересечения или блокады иннервирующих их нервов.","wrong":["Полное хирургическое удаление органа или ткани для выяснения их функции в организме.","Пересадка нервной ткани с одного участка тела на другой с восстановлением иннервации органа.","Разобщение гуморальных связей органа с кровью путем перевязки приносящих сосудов."],"t":1},{"q":"Активный транспорт это перенос веществ:","correct":"Против концентрационного или электрохимического градиента с затратой энергии метаболизма (АТФ).","wrong":["По градиенту концентрации без затраты энергии АТФ с помощью белков-переносчиков.","По электрохимическому градиенту через липидный бислой без участия белков и без затраты энергии.","По осмотическому градиенту через водные каналы (аквапорины) за счет разности концентраций."],"t":1},{"q":"Острый опыт:","correct":"Кратковременный эксперимент на наркотизированном или обездвиженном животном с нанесением операционной травмы (вивисекция) для прямого наблюдения за процессами.","wrong":["Длительное наблюдение за интактным животным после полного заживления операционных ран.","Изучение функций в естественной обстановке без наркоза на протяжении длительного времени.","Наблюдение за функциями организма человека при функциональных пробах без вмешательства в целостность тканей."],"t":1},{"q":"Хронический опыт:","correct":"Длительное наблюдение за физиологическими функциями интактного животного после полного заживления операционных ран и восстановления нормального состояния.","wrong":["Кратковременный эксперимент на наркотизированном животном с нанесением операционной травмы.","Наблюдение за процессами в изолированном органе, помещенном в питательный раствор.","Эксперимент на обездвиженном животном под наркозом, не предусматривающий его дальнейшего выживания."],"t":1},{"q":"Гомеостаз:","correct":"Относительное динамическое постоянство внутренней среды организма (крови, лимфы, тканевой жидкости) и устойчивость основных физиологических показателей.","wrong":["Динамический процесс непрерывного колебания констант организма вокруг среднего уровня.","Совокупность реакций, обеспечивающих приспособление организма к изменениям внешней среды.","Абсолютное неизменное постоянство состава крови, лимфы и тканевой жидкости без каких-либо колебаний."],"t":1},{"q":"Гомеокинез:","correct":"Динамический процесс непрерывного колебания констант организма вокруг среднего уровня под действием регуляторных механизмов обмена веществ.","wrong":["Относительное динамическое постоянство внутренней среды организма и устойчивость физиологических показателей.","Неизменное статическое постоянство констант организма, поддерживаемое без участия регуляторных механизмов.","Совокупность приспособительных реакций организма на изменение условий внешней среды."],"t":1},{"q":"Что означает в переводе с греческого физиология:","correct":"«Physis» — природа, «logos» — учение, наука (наука о природе жизненных процессов).","wrong":["«Soma» — тело, «logos» — учение (наука о строении тела).","«Physis» — жизнь, «logos» — слово (наука о жизни и смерти).","«Bios» — жизнь, «logos» — учение (наука о живых организмах)."],"t":1},{"q":"Объектами изучения физиологии являются:","correct":"Живые организмы всех уровней организации: от макромолекул и клеток до целостного организма человека и животных во взаимодействии со средой.","wrong":["Строение органов и тканей человека, их топография и взаимоотношения в организме.","Неживая природа и ее влияние на живые организмы, а также химический состав клеток.","Только макромолекулы и клетки без учета целостного организма и его связей со средой."],"t":1},{"q":"Методами физиологии являются:","correct":"Экспериментальные методы (острый и хронический опыт, экстирпация, пересадка, стимуляция, перфузия), методы регистрации биопотенциалов (электрофизиология), функциональные пробы и моделирование.","wrong":["Наружный осмотр, пальпация, перкуссия и аускультация (методы клинического обследования).","Препарирование, макро- и микроскопия, изучение строения органов и тканей на срезах.","Методы статистики и демографии: регистрация заболеваемости, смертности и анализ популяций."],"t":1},{"q":"Кто ввел хронические опыты в физиологию?","correct":"Иван Петрович Павлов.","wrong":["Клод Бернар.","Иван Михайлович Сеченов.","Владимир Михайлович Бехтерев."],"t":1},{"q":"Метод удаления органа:","correct":"Экстирпация (резекция, эктомия).","wrong":["Трансплантация.","Денервация (невротомия).","Перфузия."],"t":1},{"q":"Относительное динамическое постоянство внутренней среды и устойчивость физиологических функций:","correct":"Гомеостаз.","wrong":["Гомеокинез.","Адаптация.","Функциональная система."],"t":1},{"q":"Временное объединение функции различных тканей, органов и их систем, направленное на достижение полезного результата:","correct":"Функциональная система.","wrong":["Физиологическая система.","Орган.","Гомеостаз."],"t":1},{"q":"“Физиология - это научная основа, на которой держатся все медицинские науки” кому принадлежат эти слова:","correct":"Ивану Петровичу Павлову.","wrong":["Клоду Бернару.","Ивану Михайловичу Сеченову.","Николаю Евгеньевичу Введенскому."],"t":1},{"q":"Уровни изучения физиологических процессов:","correct":"Молекулярный, субклеточный, клеточный, тканевой, органный, системный и организменный.","wrong":["Молекулярный, клеточный, тканевой, популяционный, биосферный и экосистемный.","Только органный, системный и организменный (клеточный и молекулярный уровни относятся к биохимии).","Клеточный, тканевой, органный, системный, организменный и популяционный (уровни экологии)."],"t":1},{"q":"С помощью каких металлов Луиджи Гальвани проводил свой первый опыт с лягушкой:","correct":"Медь и цинк (или железо).","wrong":["Серебро и цинк.","Золото и медь.","Платина и свинец."],"t":1},{"q":"Система клеток и неклеточных структур, объединенных общностью строения, функции и происхождения:","correct":"Ткань.","wrong":["Орган.","Физиологическая система.","Организм."],"t":1},{"q":"Открытая макромолекулярная, саморегулирующаяся, самовосстанавливающаяся с помощью непрерывного обмена веществ и энергии:","correct":"Живая система (клетка / организм).","wrong":["Физиологическая система.","Функциональная система.","Ткань."],"t":1},{"q":"Основоположник рефлексологии и патопсихологического направления:","correct":"Владимир Михайлович Бехтерев.","wrong":["Иван Петрович Павлов.","А го транспорта (симпорта)."],"t":1},{"q":"К свойствам живой системы относится:","correct":"Обмен веществ и энергии, раздражимость, возбудимость, саморегуляция, рост, развитие, размножение, наследственность и изменчивость.","wrong":["Обмен веществ и энергии, раздражимость, возбудимость, саморегуляция, рост, размножение и неизменность состава во времени.","Обмен веществ, раздражимость, возбудимость, саморегуляция, рост, наследственность и полная независимость от внешней среды.","Раздражимость, возбудимость, саморегуляция, рост и размножение, при этом обмен веществ необязателен."],"t":1},{"q":"Активный транспорт - это транспорт веществ:","correct":"Против концентрационного или электрохимического градиента с использованием энергии АТФ.","wrong":["По градиенту концентрации без затраты АТФ через ионные каналы.","По градиенту концентрации с помощью белков-переносчиков (облегченная диффузия).","Через липидный бислой путем простой диффузии жирорастворимых веществ."],"t":1},{"q":"Биомембрана - это:","correct":"Полупроницаемая липидно-белковая структура толщиной около 7–10 нм, отделяющая цитоплазму от внешней среды или внутриклеточных компартментов.","wrong":["Полупроницаемая структура из одного слоя фосфолипидов толщиной около 1–2 нм, не содержащая белков.","Полностью проницаемая липидно-белковая оболочка толщиной около 7–10 нм, свободно пропускающая ионы и крупные молекулы.","Липидно-белковая структура толщиной около 7–10 нм, окружающая только ядро клетки и не отделяющая цитоплазму от внешней среды."],"t":1},{"q":"К мерам измерения возбудимости не относится:","correct":"Величина потенциала покоя или скорость проведения импульса (прямыми мерами возбудимости выступают порог силы / реобаза, полезное время и хронаксия).","wrong":["Пороговая сила раздражителя (реобаза).","Хронаксия.","Полезное время."],"t":1},{"q":"Полупроницаемость – это:","correct":"Способность мембраны избирательно пропускать определенные молекулы или ионы и задерживать другие.","wrong":["Способность мембраны пропускать любые молекулы и ионы с одинаковой скоростью независимо от их размера и заряда.","Способность мембраны генерировать потенциал действия в ответ на раздражитель.","Способность мембраны проводить электрический ток вдоль поверхности клетки."],"t":1},{"q":"Механизм потенциала покоя связан:","correct":"С высокой диффузной проницаемостью мембраны в покое преимущественно для ионов калия, выходящих из клетки наружу, и работой калий-натриевого насоса.","wrong":["С высокой проницаемостью мембраны в покое преимущественно для ионов натрия, входящих в клетку.","С быстрым входом ионов Ca2+ в клетку через потенциалзависимые каналы.","С открытием потенциалзависимых натриевых каналов и лавинообразным входом Na+ внутрь клетки."],"t":1},{"q":"Возбуждение характеризуется:","correct":"Быстрой сменой знака мембранного потенциала (деполяризацией с овершутом), возникновением потенциала действия и последующим специфическим ответом ткани.","wrong":["Медленным нарастанием мембранного потенциала до пороговой величины без изменения знака заряда.","Стойким увеличением поляризации мембраны (гиперполяризацией) и снижением возбудимости ткани.","Развитием локального градуального ответа, который подчиняется закону силы и затухает с расстоянием."],"t":1},{"q":"К пассивному транспорту относится:","correct":"Простая диффузия, облегченная диффузия, осмос и фильтрация.","wrong":["Простая диффузия, облегченная диффузия, работа Na+/K+-насоса и фильтрация.","Осмос, фильтрация, симпорт и антипорт.","Облегченная диффузия, эндоцитоз, экзоцитоз и работа Ca2+-насоса."],"t":1},{"q":"Величина мембранного потенциала покоя составляет:","correct":"От –60 до –90 мВ (в среднем около –70 мВ в зависимости от типа клетки).","wrong":["От –20 до –30 мВ (в среднем около –25 мВ).","От +30 до +40 мВ (в среднем около +35 мВ).","От –120 до –140 мВ (в среднем около –130 мВ)."],"t":1},{"q":"Функции биомембраны - это:","correct":"Барьерная, транспортная, рецепторная, генерация биопотенциалов, каталитическая (ферментативная), компартментализация.","wrong":["Барьерная, транспортная, рецепторная, синтез белков на мембране и хранение наследственной информации.","Только барьерная и защитная функции, транспорт веществ осуществляется исключительно цитоплазмой.","Барьерная, транспортная, рецепторная, генерация биопотенциалов, а также синтез ДНК и репликация хромосом."],"t":1},{"q":"Спирты легко проникают через биомембрану:","correct":"Поскольку они хорошо растворяются в липидной фазе мембраны (простая диффузия).","wrong":["Поскольку они хорошо растворяются в воде и проходят через ионные каналы.","Поскольку они активно переносятся Na+/K+-насосом с затратой АТФ.","Поскольку они заряжены и проходят по электрохимическому градиенту через белки-переносчики."],"t":1},{"q":"К возбудимым тканям относятся:","correct":"Нервная ткань, мышечная ткань (скелетная, гладкая, сердечная) и секреторная (железистая) ткань.","wrong":["Нервная, эпителиальная и соединительная ткани.","Мышечная, эпителиальная и костная ткани.","Скелетная мышечная, костная ткань и эпителий желез."],"t":1},{"q":"Потенциал покоя - это:","correct":"Разность электрических потенциалов между внутренней и наружной поверхностями плазматической мембраны в состоянии относительного физиологического покоя.","wrong":["Быстрое колебание мембранного потенциала со сменой знака заряда при действии порогового раздражителя.","Разность потенциалов между возбужденным и невозбужденным участками мембраны.","Разность электрических потенциалов между двумя соседними клетками в состоянии покоя."],"t":1},{"q":"К свойствам живой системы не относится:","correct":"Абсолютное статическое постоянство (неизменность во времени), кристаллизация всей массы, прекращение энергообмена.","wrong":["Обмен веществ и энергии.","Раздражимость и саморегуляция.","Рост, развитие и размножение."],"t":1},{"q":"К активному транспорту относятся:","correct":"Первично-активный транспорт (Na+/K+-насос, Ca2+-насос, H+-насос) и вторично-активный транспорт (симпорт, антипорт), а также везикулярный транспорт (эндо- и экзоцитоз).","wrong":["Простая диффузия, облегченная диффузия, осмос и фильтрация.","Только Na+/K+-насос; вторично-активный и везикулярный транспорт относятся к пассивному.","Облегченная диффузия через каналы, осмос и симпорт без затраты энергии."],"t":1},{"q":"Ионная ассиметрия биомембран - это:","correct":"Неравномерное распределение ионов по обе стороны мембраны: преобладание Na+, Cl-, Ca2+ снаружи и K+, органических анионов внутри.","wrong":["Равномерное распределение ионов по обе стороны мембраны с одинаковой концентрацией Na+ и K+.","Преобладание K+ и органических анионов снаружи клетки и Na+, Cl-, Ca2+ внутри клетки.","Различие в количестве белков на наружной и внутренней сторонах мембраны, обеспечивающее ее прочность."],"t":1},{"q":"Электрическая асимметрия - это:","correct":"Наличие разности электрических зарядов на поверхности мембраны: внутренняя сторона заряжена отрицательно по отношению к наружной положительной стороне.","wrong":["Внутренняя сторона мембраны заряжена положительно по отношению к наружной отрицательной стороне.","Неравномерное распределение ионов по обе стороны мембраны.","Различие потенциалов между возбужденным и покоящимся участками мембраны."],"t":1},{"q":"Транспортом называется:","correct":"Перенос молекул, ионов или надмолекулярных частиц через плазматическую мембрану клетки или мембраны органелл.","wrong":["Перенос веществ только внутри цитоплазмы от одной органеллы к другой без прохождения через мембрану.","Выведение продуктов обмена из клетки исключительно путем экзоцитоза.","Перенос электрических зарядов по поверхности мембраны при распространении возбуждения."],"t":1},{"q":"Микрочастицы и коллоиды проникают через биомембрану путем:","correct":"Эндоцитоза (пиноцитоза).","wrong":["Фагоцитоза.","Экзоцитоза.","Облегченной диффузии."],"t":1},{"q":"Для постсинаптической мембраны характерна:","correct":"Высокая плотность специфических хемочувствительных рецепторов (лиганд-управляемых ионных каналов) и отсутствие потенциалзависимых натриевых каналов (неспособность самостоятельно генерировать ПД, только локальный ВПСП/ТПСП).","wrong":["Высокая плотность потенциалзависимых Na+-каналов и способность генерировать потенциал действия.","Наличие везикул с медиатором и кальциевых каналов, обеспечивающих экзоцитоз.","Отсутствие рецепторов и ионных каналов, полная непроницаемость для ионов."],"t":1},{"q":"Меры измерения возбудимости - это:","correct":"Порог раздражения (реобаза), полезное время, хронаксия, лабильность (лабильность Введенского).","wrong":["Порог раздражения, амплитуда ПД, скорость проведения и потенциал покоя.","Реобаза, хронаксия, величина мембранного потенциала и скорость проведения.","Амплитуда ПД, величина овершута, длительность следовой гиперполяризации и скорость проведения."],"t":1},{"q":"К мерам измерения возбудимости не относится:","correct":"Амплитуда потенциала действия, температура ткани, величина pH (эти параметры не отражают величину порога срабатывания).","wrong":["Порог раздражения (реобаза).","Хронаксия.","Полезное время."],"t":1},{"q":"К функциям биомембран не относится:","correct":"Синтез полипептидных цепей в первичной структуре (это функция рибосом) и хранение геномной ДНК.","wrong":["Барьерная и транспортная функции.","Рецепторная функция (восприятие сигналов).","Генерация и проведение биопотенциалов."],"t":1},{"q":"Механизм потенциала покоя связан с:","correct":"Выходом ионов K+ из клетки по концентрационному градиенту через каналы утечки и поддержанием градиента Na+/K+-АТФазой.","wrong":["Входом ионов Na+ в клетку через потенциалзависимые каналы и работой Ca2+-насоса.","Выходом ионов Cl- из клетки по градиенту и работой Na+/K+-АТФазы.","Входом ионов Ca2+ в клетку, обеспечивающим положительный заряд внутренней стороны мембраны."],"t":1},{"q":"Аккомодация - это:","correct":"Приспособление возбудимой ткани к действию медленно нарастающего по силе раздражителя, приводящее к повышению порога возбуждения.","wrong":["Снижение порога возбуждения при действии быстро нарастающего раздражителя.","Временное полное отсутствие возбудимости ткани после развития потенциала действия.","Способность ткани отвечать на раздражение генерацией потенциала действия."],"t":1},{"q":"К активному транспорту относится:","correct":"Работа натрий-калиевой АТФазы (Na+/K+-насоса).","wrong":["Диффузия кислорода через мембрану.","Работа калиевых каналов утечки.","Осмос воды через аквапорины."],"t":1},{"q":"Основное свойство всех живых систем:","correct":"Раздражимость и обмен веществ (метаболизм).","wrong":["Электропроводность и осмотическая стабильность.","Сократимость и проводимость.","Неизменность химического состава и структуры."],"t":1},{"q":"Фосфолипиды мембраны выполняют функцию:","correct":"Формирование структурного гидрофобного бислоя (барьерная функция и матрица для мембранных белков).","wrong":["Транспорт ионов против градиента концентрации с затратой АТФ.","Рецепция гормонов и медиаторов, передача сигнала внутрь клетки.","Ферментативный катализ реакций на поверхности мембраны."],"t":1},{"q":"Впервые электрические явления в живых тканях обнаружил:","correct":"Луиджи Гальвани (1791 г.).","wrong":["Алессандро Вольта.","Иван Михайлович Сеченов.","Рене Декарт."],"t":1},{"q":"Если порог раздражения высокий, то возбудимость ткани:","correct":"Низкая (возбудимость обратно пропорциональна порогу раздражения).","wrong":["Высокая.","Не зависит от величины порога.","Нулевая (ткань полностью невозбудима)."],"t":1},{"q":"Если порог раздражения низкий, то возбудимость ткани:","correct":"Высокая.","wrong":["Низкая.","Не зависит от порога раздражения.","Меняется только при изменении частоты стимуляции."],"t":1},{"q":"Рефрактерность - это:","correct":"Временное снижение или полное отсутствие возбудимости ткани в процессе и непосредственно после развития волны возбуждения.","wrong":["Повышение возбудимости ткани после длительного действия подпорогового раздражителя.","Приспособление ткани к медленно нарастающему раздражителю с повышением порога.","Способность ткани воспроизводить без искажения частоту наносимых раздражений."],"t":1},{"q":"Местное возбуждение возникает при действии:","correct":"Подпороговых раздражителей.","wrong":["Пороговых раздражителей.","Сверхпороговых раздражителей.","Только быстро нарастающих по силе раздражителей любой интенсивности."],"t":1},{"q":"Самой высокой возбудимостью в нейроне обладает:","correct":"Аксиальный холмик (начальный сегмент аксона), где плотность потенциалзависимых Na+-каналов максимальна.","wrong":["Тело нейрона (сома).","Дендриты.","Пресинаптическое окончание (терминаль аксона)."],"t":1},{"q":"Быстрая деполяризация связана с:","correct":"Массивным лавинообразным входом ионов Na+ внутрь клетки через открывшиеся потенциалзависимые натриевые каналы.","wrong":["С выходом ионов K+ из клетки через потенциалзависимые калиевые каналы.","С входом ионов Cl- в клетку по электрохимическому градиенту.","С работой Na+/K+-насоса, выкачивающего Na+ из клетки."],"t":1},{"q":"Фаза относительной рефрактерности соответствует:","correct":"Периоду быстрой реполяризации и следовой гиперполяризации.","wrong":["Периоду медленной деполяризации до критического уровня.","Периоду быстрой деполяризации и овершута.","Периоду латентного (скрытого) периода до начала развития деполяризации."],"t":1},{"q":"Нисходящая часть пика ПД - это:","correct":"Фаза реполяризации.","wrong":["Фаза быстрой деполяризации.","Фаза овершута (инверсии заряда).","Фаза локального ответа."],"t":1},{"q":"Роль натрий-калиевого насоса:","correct":"Поддержание трансмембранных градиентов концентраций Na+ и K+ (откачивание Na+ наружу и закачивание K+ внутрь) и создание электрогенного потенциала.","wrong":["Обеспечение входа Na+ и выхода K+ по градиенту концентрации без затраты энергии.","Лавинообразный вход Na+ в клетку в фазу деполяризации.","Транспорт глюкозы и аминокислот в клетку вместе с ионами K+."],"t":1},{"q":"Стимулирующие приборы:","correct":"Приборы, вырабатывающие калиброванные раздражающие сигналы для воздействия на объект (электростимуляторы, генераторы прямоугольных импульсов).","wrong":["Приборы для улавливания, усиления и записи биологических сигналов (электроэнцефалографы, самописцы).","Приборы для количественного определения физических величин (вольтметры, термометры).","Приборы для хранения и математической обработки полученных данных (компьютеры, накопители)."],"t":1},{"q":"Регистрирующие приборы:","correct":"Приборы, предназначенные для улавливания, усиления и записи биологических сигналов (электрокардиографы, электроэнцефалографы, осциллографы, самописцы).","wrong":["Приборы, вырабатывающие калиброванные раздражающие сигналы для воздействия на объект (электростимуляторы).","Приборы для количественного определения физических и биохимических величин (вольтметры, pH-метры).","Приборы для хранения и математической обработки данных (архиваторы, статистические пакеты)."],"t":1},{"q":"Измерительные приборы:","correct":"Приборы, служащие для количественного определения физических и биохимических величин (вольтметры, термометры, pH-метры, калибраторы).","wrong":["Приборы, вырабатывающие калиброванные раздражающие сигналы для воздействия на объект (генераторы импульсов).","Приборы, предназначенные для улавливания, усиления и записи биологических сигналов (самописцы, осциллографы).","Приборы для создания искусственных условий среды (термостаты, барокамеры, перфузионные насосы)."],"t":1},{"q":"К какой группе приборов относится электростимулятор?","correct":"К стимулирующим приборам.","wrong":["К регистрирующим приборам.","К измерительным приборам.","К усилительным приборам."],"t":1},{"q":"К какой группе приборов относится термометр?","correct":"К измерительным приборам.","wrong":["К стимулирующим приборам.","К регистрирующим приборам.","К усилительным приборам."],"t":1},{"q":"К какой группе приборов относится электрокардиограф?","correct":"К регистрирующим приборам.","wrong":["К стимулирующим приборам.","К измерительным приборам.","К усилительным приборам."],"t":1},{"q":"Биоэлектрический явления вдоль мембраны:","correct":"Распространение локальных подпороговых токов (электротоническое затухающее распространение) и проведение незатухающего потенциала действия (импульса).","wrong":["Только проведение незатухающего потенциала действия, локальные токи вдоль мембраны не возникают.","Движение ионов только по градиенту концентрации поперек мембраны без образования токов вдоль ее поверхности.","Электротоническое распространение подпорогового потенциала, не затухающее с расстоянием."],"t":1},{"q":"Отличие локального ответа от ПД:","correct":"Локальный ответ возникает при подпороговом раздражении, градуален (зависит от силы стимула), не подчиняется закону «всё или ничего», распространяется с затуханием (декрементом) и способен к суммации; ПД подчиняется закону «всё или ничего», не суммируется и распространяется без затухания.","wrong":["Локальный ответ возникает при подпороговом раздражении, подчиняется закону «всё или ничего», не суммируется и распространяется без затухания; ПД градуален и затухает.","Локальный ответ возникает только при сверхпороговом раздражении, не суммируется и распространяется без затухания; ПД градуален и способен к суммации.","Локальный ответ распространяется на большие расстояния без декремента, а ПД ограничен зоной раздражения и затухает."],"t":1},{"q":"Что такое селективность:","correct":"Способность ионных каналов избирательно пропускать ионы только определенного вида (например, только Na+, K+ или Ca2+).","wrong":["Способность каналов открываться и закрываться в ответ на изменение мембранного потенциала.","Способность каналов инактивироваться при длительной деполяризации и становиться временно непроницаемыми.","Способность мембраны пропускать воду и не пропускать растворенные вещества."],"t":1},{"q":"Сколько ионов натрия натрий-калиевый насос выводит из клетки?","correct":"3 иона натрия (за один цикл расщепления молекулы АТФ).","wrong":["2 иона натрия.","4 иона натрия.","5 ионов натрия."],"t":1},{"q":"Сколько ионов калия натрий-калиевый насос вводит в клетку?","correct":"2 иона калия.","wrong":["1 ион калия.","3 иона калия.","4 иона калия."],"t":1},{"q":"Какие ионные каналы открыты в момент покоя?","correct":"Неуправляемые калиевые каналы утечки (leak channels).","wrong":["Потенциалзависимые натриевые каналы (активационные ворота открыты).","Потенциалзависимые калиевые и кальциевые каналы.","Все ионные каналы закрыты, ионы перемещаются только через насосы."],"t":1},{"q":"Какие ионные каналы открыты в момент возбуждения?","correct":"Потенциалзависимые натриевые каналы (в фазу деполяризации), а затем потенциалзависимые калиевые каналы (в фазу реполяризации).","wrong":["Калиевые каналы утечки, а потенциалзависимые натриевые каналы остаются закрытыми.","Сначала потенциалзависимые калиевые каналы (деполяризация), затем натриевые (реполяризация).","Только хлорные каналы, обеспечивающие вход Cl- в клетку."],"t":1},{"q":"Что такое следовая деполяризация?","correct":"Замедленная фаза реполяризации, когда мембранный потенциал временно остается менее отрицательным, чем потенциал покоя, из-за медленного выхода избытка калия из околомембранного пространства.","wrong":["Кратковременное увеличение мембранного потенциала выше уровня покоя из-за повышенной активности насоса.","Быстрая фаза деполяризации с овершутом, возникающая при входе Na+.","Резкое снижение мембранного потенциала ниже порога из-за входа Na+ после окончания ПД."],"t":1},{"q":"Что такое следовая гиперполяризация?","correct":"Кратковременное увеличение мембранного потенциала выше уровня покоя (внутренняя среда становится более отрицательной) вследствие продолжающегося выхода K+ через медленно закрывающиеся каналы и повышенной активности Na+/K+-насоса.","wrong":["Замедление реполяризации, когда потенциал остается менее отрицательным, чем потенциал покоя.","Быстрое снижение мембранного потенциала до нуля с последующей инверсией заряда.","Кратковременное снижение мембранного потенциала до пороговой величины из-за входа Na+."],"t альная плотность потенциалзависимых натриевых каналов, и генерируется потенциал действия.","wrong":["Расположены потенциалзависимые калиевые каналы, и потенциал действия не возникает.","Максимально плотная миелиновая оболочка и сосредоточены калиевые каналы утечки.","Находятся синаптические контакты с соседними волокнами, через которые возбуждение переходит на другие аксоны."],"t":4},{"q":"Основным признаком неврологических заболеваний, сопровождающихся исчезновением миелиновой оболочки (демиелинизацией), является:","correct":"Резкое замедление или полная блокада проведения нервных импульсов, быстрая истощаемость и парезы/параличи.","wrong":["Ускорение проведения импульсов и повышение лабильности нерва.","Полное восстановление проведения после отдыха без парезов и параличей.","Появление сальтаторного проведения по безмиелиновым участкам аксона."],"t":4},{"q":"В химическом синапсе возбуждение с пресинаптического окончания на постсинаптическую клетку передается при помощи:","correct":"Химического посредника — нейромедиатора.","wrong":["Электрического тока через щелевой контакт (нексус).","Ионов кальция, переходящих из одной клетки в другую.","Белковых молекул, секретируемых в кровь."],"t":4},{"q":"Частичная блокада постсинаптических рецепторов в химическом синапсе приведет к:","correct":"Снижению амплитуды постсинаптического потенциала и ухудшению либо блокаде синаптической передачи.","wrong":["Повышению амплитуды постсинаптического потенциала.","Увеличению синаптической задержки при неизменной амплитуде ВПСП.","Усилению синаптической передачи за счет накопления медиатора."],"t":4},{"q":"При полной блокаде действия ацетилхолина передача возбуждения с двигательного нервного окончания на скелетную мышцу:","correct":"Полностью прекращается (развивается вялый паралич мышцы).","wrong":["Сохраняется, но с большой синаптической задержкой.","Усиливается и приводит к тетаническому сокращению мышцы.","Не меняется, так как сокращение запускается ионами кальция независимо от медиатора."],"t":4},{"q":"На нервную клетку нанесли некий препарат, в результате чего резко замедлилась фаза реполяризации потенциала действия. Этот препарат, скорее всего:","correct":"Блокирует потенциалзависимые калиевые каналы (например, тетраэтиламмоний).","wrong":["Блокирует потенциалзависимые натриевые каналы (например, тетродотоксин).","Блокирует ацетилхолинэстеразу в синаптической щели.","Блокирует хлорные каналы постсинаптической мембраны (например, стрихнин)."],"t":4},{"q":"Для оценки возбудимости нерва у больного вы будете определять:","correct":"Порог силы раздражения (реобазу) и хронаксию.","wrong":["Амплитуду потенциала действия и длительность рефрактерного периода.","Скорость проведения возбуждения и толщину миелиновой оболочки.","Только время рефлекса и величину сухожильного рефлекса."],"t":4},{"q":"Какой из перечисленных ниже медиаторов чаще других выполняет роль тормозного нейромедиатора?","correct":"ГАМК (гамма-аминомасляная кислота).","wrong":["Глутамат.","Аспартат.","Ацетилхолин."],"t":4},{"q":"Что из перечисленного ниже не является критерием для отнесения вещества к нейромедиаторам?","correct":"Способность проникать через гематоэнцефалический барьер при инъекции в кровь (или синтез исключительно в ядре клетки).","wrong":["Синтез вещества в нейроне и накопление в пресинаптических окончаниях.","Выделение вещества при возбуждении в синаптическую щель.","Наличие специфических рецепторов на постсинаптической мембране."],"t":4},{"q":"Что вызывает ток ионов кальция в пресинаптическое окончание во время передачи информации через синапс?","correct":"Деполяризация пресинаптической мембраны пришедшим потенциалом действия, открывающая потенциалзависимые кальциевые каналы.","wrong":["Гиперполяризация пресинаптической мембраны.","Связывание медиатора с рецепторами постсинаптической мембраны.","Работа Ca2+-АТФазы, закачивающей кальций в пресинаптическое окончание."],"t":4},{"q":"Пресинаптическое торможение может возникать при:","correct":"Активации аксо-аксональн судата) в плевральной полости при сердечной недостаточности или гипопротеинемии.","wrong":["Скоплении воздуха в плевральной полости.","Скоплении гноя в плевральной полости.","Скоплении крови в плевральной полости."],"t":11},{"q":"За что отвечает апнейстический центр:","correct":"Тонизирует инспираторные нейроны продолговатого мозга, удлиняя фазу вдоха (стимулирует вдох).","wrong":["Ограничивает продолжительность вдоха, переключая вдох на выдох.","Стимулирует выдох и угнетает вдох.","Регулирует частоту дыхания в зависимости от pCO2."],"t":11},{"q":"За что отвечает пневмотаксический центр:","correct":"Контролирует и ограничивает продолжительность вдоха, способствуя плавному и своевременному переключению вдоха на выдох.","wrong":["Удлиняет фазу вдоха, тонизируя инспираторные нейроны.","Стимулирует вдох при растяжении легких.","Формирует основной ритм дыхания."],"t":11},{"q":"Вклад мозжечка в процесс дыхания:","correct":"Координация дыхательных движений с двигательными актами, фазами ходьбы, бега и положением тела.","wrong":["Формирование основного ритма дыхания.","Регуляция дыхания по уровню CO2 в крови.","Контроль силы сокращения диафрагмы без участия других центров."],"t":11},{"q":"Вклад гипоталамуса в процесс дыхания:","correct":"Приспособление дыхания к эмоциональным реакциям, болевым раздражителям, температурным изменениям (терморегуляторное дыхание) и метаболическим потребностям.","wrong":["Формирование основного ритма дыхания.","Регуляция дыхания по растяжению легких.","Произвольная задержка дыхания."],"t":11},{"q":"Структурно-функциональной единицей легких является:","correct":"Ацинус.","wrong":["Альвеола.","Долька легкого.","Сегмент легкого."],"t":11},{"q":"Не дыхательной функцией легких является:","correct":"Фильтрационная и защитная (очищение крови от микротромбов и инородных частиц).","wrong":["Газообмен между альвеолярным воздухом и кровью.","Вентиляция легких.","Диффузия газов через аэрогематический барьер."],"t":11},{"q":"Мышцы участвующие при активном выдохе:","correct":"Внутренние межреберные мышцы, подреберные мышцы и мышцы передней брюшной стенки (прямая, наружная и внутренняя косые, поперечная мышцы живота).","wrong":["Диафрагма и наружные межреберные мышцы.","Диафрагма и подреберные мышцы.","Наружные межреберные мышцы и мышцы шеи."],"t":11},{"q":"Нормальное содержание кислорода в атмосферном воздухе составляет:","correct":"20,94% (около 21%).","wrong":["0,03%.","79%.","14%."],"t":11},{"q":"Парциальное давление газа:","correct":"Часть общего давления газовой смеси, которую производил бы данный газ, если бы он один занимал весь объем смеси при той же температуре.","wrong":["Общее давление газовой смеси.","Давление газа, растворенного в жидкости при данной температуре.","Сумма давлений всех газов, входящих в смесь."],"t":11},{"q":"Разница парциального давления кислорода составляет:","correct":"Между альвеолярным воздухом (100–104 мм рт. ст.) и венозной кровью (40 мм рт. ст.) — около 60–64 мм рт. ст.","wrong":["Между атмосферным воздухом (159 мм рт. ст.) и альвеолярным воздухом (100 мм рт. ст.) — около 59 мм рт. ст.","Между артериальной (95 мм рт. ст.) и венозной (40 мм рт. ст.) кровью — около 55 мм рт. ст.","Между альвеолярным воздухом (100 мм рт. ст.) и тканями (0 мм рт. ст.) — около 100 мм рт. ст."],"t":11},{"q":"Разница парциального давления углекислого газа составляет:","correct":"Между венозной кровью (46 мм рт. ст.) и альвеолярным воздухом (40 мм рт. ст.) — около 6 мм рт. ст.","wrong":["Между тканями (60 мм рт. ст.) и венозной кровью (46 мм рт. ст.) — около 14 мм рт. ст.","Между артериальной (40 мм рт. ст.) и венозной (46 мм рт. ст.) кровью при отсутствии газообмена — около 6 мм рт. ст.","Между альвеолярным воздухом (40 мм рт. ст.) и атмосферным (0,2 мм рт. ст.) — около 40 мм рт. ст."],"t":11},{"q":"Недыхательной функцией легких является:","correct":"Метаболическая функция (инактивация брадикинина, норадреналина, серотонина и синтез ангиотензина II ангиотензинпревращающим ферментом), а также поддержание водного баланса и терморегуляция.","wrong":["Газообмен кислорода и углекислого газа.","Вентиляция легких.","Транспорт кислорода к тканям."],"t":11}]</script>
<script>
(function(){
var ALL=JSON.parse(document.getElementById('data').textContent);
var KEY='phys_errors_v1',errs=new Set();
try{errs=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(Array.from(errs)))}catch(e){}}
ALL.forEach(function(q,i){q.id=i});
var TC={};ALL.forEach(function(q){TC[q.t]=(TC[q.t]||0)+1});
var TOPICS=Object.keys(TC).map(Number);
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0,t=a[i];a[i]=a[j];a[j]=t}return a}
var S={mode:'test',topic:0,deck:[],i:0,ok:0,bad:0,opts:[],ci:0,picked:-1,done:false};
function prep(){var q=S.deck[S.i];if(!q)return;S.opts=shuf([q.correct].concat(q.wrong));S.ci=S.opts.indexOf(q.correct)}
function build(){
  var pool=ALL.filter(function(q){return !S.topic||q.t===S.topic});
  if(S.mode==='err')pool=pool.filter(function(q){return errs.has(q.id)});
  S.deck=shuf(pool);S.i=0;S.ok=0;S.bad=0;S.picked=-1;S.done=false;prep();render();
}
function pick(k){
  if(S.mode==='learn'||S.picked>=0||S.done||!S.deck[S.i]||k>=S.opts.length)return;
  var q=S.deck[S.i];S.picked=k;
  if(k===S.ci){S.ok++;if(S.mode==='err'){errs.delete(q.id);save()}}
  else{S.bad++;errs.add(q.id);save()}
  render();
}
function next(){
  if(S.done||!S.deck.length)return;
  if(S.mode!=='learn'&&S.picked<0)return;
  if(S.i<S.deck.length-1){S.i++;S.picked=-1;prep()}else S.done=true;
  render();
}
function render(){
  var h='<h1>Нормальная физиология</h1>';
  h+='<div class="chips"><span class="chip">Верно <b>'+S.ok+'</b></span><span class="chip bad">Ошибок <b>'+S.bad+'</b></span><span class="chip">В «Ошибках» <b>'+errs.size+'</b></span></div>';
  h+='<div class="tabs">'+[['test','Тест'],['learn','Учить'],['err','Ошибки']].map(function(m){return '<button class="tab'+(S.mode===m[0]?' on':'')+'" data-m="'+m[0]+'">'+m[1]+'</button>'}).join('')+'</div>';
  h+='<div class="topics"><button class="tp'+(!S.topic?' on':'')+'" data-t="0">Все ('+ALL.length+')</button>'+TOPICS.map(function(t){return '<button class="tp'+(S.topic===t?' on':'')+'" data-t="'+t+'">Тема '+t+' ('+TC[t]+')</button>'}).join('')+'</div>';
  var n=S.deck.length;
  if(!n){
    h+='<div class="empty">'+(S.mode==='err'?'Ошибок пока нет. Пройдите тест — неверные ответы попадут сюда.':'В этой теме нет вопросов.')+'</div>';
  }else if(S.done){
    var tot=S.ok+S.bad,p=tot?Math.round(S.ok/tot*100):0;
    h+='<div class="card"><div class="meta">Результат</div><div class="big">'+p+'%</div><div>Верно '+S.ok+' из '+tot+'</div><div class="row"><button class="btn" data-a="again">Ещё раз</button>'+(errs.size?'<button class="btn g" data-m="err">К ошибкам</button>':'')+'</div></div>';
  }else{
    var q=S.deck[S.i],learn=S.mode==='learn',shown=learn||S.picked>=0;
    h+='<div class="bar"><i style="width:'+Math.round((S.i+(shown?1:0))/n*100)+'%"></i></div>';
    h+='<div class="card" data-k="'+q.id+'-'+S.i+'"><div class="meta">Тема '+q.t+', вопрос '+(S.i+1)+' из '+n+'</div><h2>'+esc(q.q)+'</h2>';
    if(learn){h+='<div class="ans"><small>Правильный ответ</small>'+esc(q.correct)+'</div>'}
    else{h+=S.opts.map(function(o,k){var c='opt';if(S.picked>=0){if(k===S.ci)c+=' ok';else if(k===S.picked)c+=' no'}return '<button class="'+c+'" data-k="'+k+'"'+(S.picked>=0?' disabled':'')+'><i>'+(k+1)+'</i><span>'+esc(o)+'</span></button>'}).join('')}
    h+='<div class="row">'+(shown?'<button class="btn" data-a="next">Дальше</button>':'')+'<button class="btn g" data-a="finish">Завершить</button></div></div>';
  }
  document.getElementById('app').innerHTML=h;
}
var app=document.getElementById('app');
app.addEventListener('click',function(e){
  var el=e.target.closest('button');if(!el)return;
  if(el.dataset.m){S.mode=el.dataset.m;build()}
  else if(el.dataset.t!==undefined){S.topic=+el.dataset.t;build()}
  else if(el.dataset.a==='next')next();
  else if(el.dataset.a==='again')build();
  else if(el.dataset.a==='finish'){S.done=true;render()}
  else if(el.dataset.k!==undefined&&el.classList.contains('opt'))pick(+el.dataset.k);
});
document.addEventListener('keydown',function(e){
  if(e.key>='1'&&e.key<='4')pick(+e.key-1);
  else if(e.key==='Enter'||e.key==='ArrowRight')next();
});
build();
})();
</script>
