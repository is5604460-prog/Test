<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Валеология №11: Половое созревание</title>
<style>
:root{--bg:#eef4fb;--card:#fff;--tx:#14233a;--mut:#5b6b82;--ac:#2563eb;--ok:#16a34a;--bad:#dc2626;--bd:#d5e0ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1522;--card:#172236;--tx:#e8eef8;--mut:#95a4bd;--ac:#60a5fa;--ok:#4ade80;--bad:#f87171;--bd:#2a3850}}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,var(--bg),color-mix(in srgb,var(--ac) 12%,var(--bg)));min-height:100vh;color:var(--tx);font:16px/1.5 system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:6px 0 2px}.sub{color:var(--mut);font-size:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 4px 14px #0001;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pop{50%{transform:scale(1.04)}}
.shake{animation:shake .35s}.pop{animation:pop .4s}
.mode{display:flex;gap:12px;align-items:center;width:100%;text-align:left;cursor:pointer;color:var(--tx);font:inherit;transition:transform .15s}
.mode:active{transform:scale(.97)}.mode em{font-style:normal;font-size:32px}.mode b{display:block;font-size:17px}.mode span{color:var(--mut);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:14px;margin-bottom:8px}
.bar{height:8px;background:var(--bd);border-radius:4px;margin-bottom:12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.tm i{background:#f59e0b;transition:width .1s linear}
.q{font-size:19px;font-weight:650;margin:4px 0 14px}.tag{font-size:12px;color:var(--ac);font-weight:700;text-transform:uppercase}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px;padding:13px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer;transition:.15s}
.opt:not(:disabled):hover{border-color:var(--ac);transform:translateX(3px)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.row{display:flex;gap:8px}.row .opt{text-align:center;font-weight:700}
#c{touch-action:pan-y;user-select:none;position:relative}.hint{position:absolute;top:10px;font-weight:800;opacity:0;transition:opacity .1s}
.exp{margin:10px 0;padding:11px 13px;border-radius:10px;font-size:15px;background:color-mix(in srgb,var(--ac) 9%,var(--card))}
.exp p{margin:0 0 8px}.exp p:last-child{margin:0}.w{color:var(--bad)}.r{color:var(--ok)}
.btn{padding:12px 20px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer;margin:4px 8px 0 0}.btn.g{background:var(--bd);color:var(--tx)}
.big{font-size:48px;font-weight:800;text-align:center}.ctr{text-align:center}
.tr{display:flex;align-items:center;gap:8px;font-size:22px}.tr .bar{flex:1;margin:0;height:12px}.tr i{background:linear-gradient(90deg,#ef4444,#f59e0b,#22c55e)}
.sw{color:var(--mut);font-size:12px;text-align:center;margin-top:10px}.wr{display:flex;gap:8px;align-items:stretch;margin-bottom:12px}.wr .card{flex:1;min-width:0;margin:0;display:flex;flex-direction:column;justify-content:center;min-height:200px}.side{width:76px;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:13px;opacity:.45;border-style:dashed;padding:6px}.side:not(:disabled):hover{transform:none}.side.ok,.side.bad{opacity:1!important}.ar{display:flex;align-items:center;gap:6px;margin:6px 0}.fi{flex:1;text-align:center;padding:10px 4px;border-radius:14px;background:var(--card);border:2px solid var(--bd);font-size:13px;transition:.2s}.fi.act{border-color:var(--ac);box-shadow:0 0 14px color-mix(in srgb,var(--ac) 50%,transparent);transform:scale(1.04)}.fa{font-size:38px}.vs{font-weight:800;color:var(--bad)}.cm{margin:10px 0;padding:10px 12px;border-radius:12px;background:#f59e0b22;border:1px dashed #f59e0b;font-size:14px}.in{width:100%;padding:12px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:8px}
</style></head><body><main id="app"></main>
<script>
var YN=["Норма","К врачу"],TF=["Верно","Неверно"],ST=["Физическое","Половое","Психическое","Социальное"];
var W3=["Физическое (соматическое) развитие — это рост, пропорции тела, мышцы, кости, работа внутренних органов. Этот признак сюда не вписывается.","Половое (пубертатное) развитие — это созревание половой системы и вторичные половые признаки. Этот признак относится к другой сфере.","Психическое и эмоциональное созревание — это эмоции, мышление, самооценка. Здесь признак другой природы.","Социальное становление — это идентичность, общение, роли, нормы поведения. Этот признак к нему не относится."];
var M=[
{i:"🩺",n:"Норма или к врачу?",d:"Свайпай карточку: влево — норма, вправо — к врачу",t:"Ситуация",sw:1,it:[
["Девочка 12 лет: одна грудь чуть больше другой",YN,0,"Грудь растёт неравномерно, по размеру и форме одна может отличаться от другой. Это вариант нормы, лечения не требует.","К врачу не нужно: асимметрия сама по себе не признак болезни. Поводом было бы уплотнение не позади соска."],
["Уплотнение в груди, но не позади соска",YN,1,"Растущая железа в норме прощупывается именно позади соска. Уплотнение в другом месте не похоже на обычный рост груди и требует осмотра.","Нормой считается только уплотнение позади соска (растущая железистая ткань). Здесь расположение другое, поэтому «норма» неверна."],
["Мальчику 13 лет: грудь слегка увеличилась, яички уже увеличены",YN,0,"Гинекомастия в пубертате встречается примерно у половины мальчиков и обычно проходит за 1–2 года. Яички уже выросли, значит, порядок созревания обычный.","Повода для врача нет: гинекомастия в пубертате — вариант нормы. Тревожно, когда она появляется РАНЬШЕ роста яичек или есть выделения из сосков."],
["Гинекомастия у мальчика появилась раньше, чем увеличились яички",YN,1,"Пубертат у мальчика начинается с увеличения яичек. Если грудь выросла раньше, возможен гормональный сбой, нужно обследование.","Сама гинекомастия может быть нормой, но не в таком порядке: появление до роста яичек — признак для визита к врачу."],
["Девочка 12 лет: прозрачные бело-бежевые выделения без запаха",YN,0,"Бели появляются за 6–12 месяцев до первых месячных. Прозрачные или бело-бежевые, без запаха и дискомфорта — это норма.","Цвет, отсутствие запаха и жалоб говорят о норме: так организм готовится к менструации."],
["Зеленоватые выделения с неприятным запахом, зуд и жжение",YN,1,"Зелёный цвет, запах, зуд или боль — признаки воспаления или инфекции. Нормальные выделения прозрачные и без запаха.","Нормой считаются только прозрачные или бело-бежевые выделения без запаха и дискомфорта. Здесь все три тревожных признака сразу."],
["Девочке 15,5 лет, месячных ещё не было",YN,1,"Месячные приходят в течение 2–3 лет после роста груди, а к 15 годам должны уже быть. Их отсутствие — повод для обследования.","Граница нормы — 15 лет (или 3 года после начала роста груди). 15,5 уже за этой границей."],
["Взрослый запах пота у девочки 7 лет, других признаков нет",YN,0,"Запах может появиться раньше возраста пубертата, и это нормально, если нет других признаков раннего созревания.","Сам по себе запах не болезнь. К врачу идут, если у девочки младше 8 лет растут тёмные длинные волосы, увеличивается грудь и т.п."],
["Тёмные длинные лобковые волосы у девочки 7 лет",YN,1,"Взрослые волосы раньше 8 лет у девочки (9 у мальчика) говорят о слишком раннем начале пубертата.","Порог для девочки 8 лет, для мальчика 9. В 7 лет такие волосы — не вариант нормы."],
["Подросток 14 лет раздражителен, чаще спорит, требует свободы",YN,0,"Гормональная перестройка делает подростков эмоциональнее, они чаще нарушают правила и хотят больше свободы. Это часть созревания.","К врачу или психологу нужно при проблемах со сном и питанием, постоянной подавленности, сильной агрессии или словах о вреде себе или другим. Обычные споры — норма."]]},
{i:"🔢",n:"Цифры и сроки",d:"Возрастные рамки и интервалы из презентации",t:"Выбери ответ",it:[
["Пубертат у девочек обычно начинается в…",["7–8 лет","9–13 лет","14–16 лет"],1,"По презентации у девочек пубертат начинается в 9–13 лет, когда активно включается гормональная система.",["Это раньше нормы: признаки до 8 лет считаются ранним созреванием.",0,"Это позже: к 14–16 годам пубертат у большинства девочек уже идёт."]],
["Пубертат у мальчиков обычно начинается в…",["8–9 лет","10–14 лет","15–16 лет"],1,"У мальчиков пубертат начинается в 10–14 лет, чуть позже, чем у девочек.",["Слишком рано: признаки до 9 лет у мальчика — повод для врача.",0,"Это поздно: типичное начало 10–14 лет."]],
["Месячные приходят через … после начала роста груди",["6 месяцев","2–3 года","5–6 лет"],1,"Сначала растёт грудь, затем 2–3 года идёт гормональная перестройка, и приходят месячные. Если прошло 3 года без них — к врачу.",["Слишком быстро: цикл формируется дольше.",0,"Слишком долго: через 3 года без месячных уже нужно обращаться к врачу."]],
["Бели появляются до первых месячных за…",["1–2 недели","6–12 месяцев","3 года"],1,"Бели — предвестник менструации и появляются за 6–12 месяцев до неё.",["Слишком короткий срок: бели появляются заметно раньше.",0,"Слишком долго: на такой срок они уже не привязаны к менструации."]],
["В скачок роста подросток прибавляет…",["около 2 см в год","8 см в год и больше","около 20 см в год"],1,"Организм растёт стремительно: по 8 см за год и больше.",["2 см в год — обычный темп вне скачка.",0,"20 см в год физиологически нереально."]],
["Тёмные длинные волосы у девочки — повод к врачу, если она младше…",["8 лет","12 лет","14 лет"],0,"Порог для девочки 8 лет: раньше этого возраста речь о слишком раннем пубертате.",[0,"В 12 лет это типичный возраст пубертата, поводом к врачу не является.","В 14 лет это тем более норма."]],
["Гинекомастия у мальчиков обычно проходит за…",["1–2 года","1 неделю","10 лет"],0,"Ткань груди перестраивается вместе с гормональным фоном, обычно за 1–2 года.",[0,"Так быстро не бывает: гормональный фон меняется месяцами.","10 лет — не норма: если сохраняется, нужно показать врачу."]]]},
{i:"🧩",n:"Четыре этапа",d:"К какому этапу созревания относится признак",t:"К какому этапу?",it:[
["Увеличение мышечной массы у мальчиков",ST,0,"Рост мышц, костей и длины конечностей — соматическое (физическое) развитие: меняется строение тела.",W3],
["Расширение таза у девочек",ST,0,"Изменение пропорций тела — физическое развитие, хотя запущено гормонами.",W3],
["Становление менструального цикла",ST,1,"Это созревание половой системы — пубертатное развитие.",W3],
["Начало сперматогенеза у мальчиков",ST,1,"Созревание половой системы: яички начинают вырабатывать сперматозоиды.",W3],
["Эмоциональная нестабильность и стремление к самостоятельности",ST,2,"Это психическое и эмоциональное созревание: чувства становятся сильнее, растёт потребность в независимости.",W3],
["Развитие абстрактного мышления",ST,2,"Это работа психики: подросток учится мыслить абстрактно, критично и анализировать свои чувства.",W3],
["Мнение друзей резко влияет на самооценку",ST,3,"Растёт роль сверстников — признак социального становления личности.",W3],
["Подросток примеряет роли: ученик, друг, лидер",ST,3,"Освоение социальных ролей — часть социального становления.",W3]]},
{i:"⚡",n:"Верно / неверно",d:"Блиц на время: 3 жизни, по 12 секунд на ответ",t:"Утверждение",sw:1,tm:1,it:[
["Гинекомастия встречается примерно у половины мальчиков",TF,0,"Верно: это вариант нормы пубертата, обычно проходит за 1–2 года.","Это правда: гинекомастия — частое явление, а не редкая болезнь."],
["Скачок роста начинается только в 15–16 лет",TF,1,"Неверно: у девочек пубертат и скачок роста начинаются в 9–13 лет, у мальчиков в 10–14.","Это не так: 15–16 лет — конец пубертата, а не начало."],
["Ночная эякуляция — признак болезни",TF,1,"Неверно: эякуляция во сне — нормальная часть созревания.","Ошибка: ночная эякуляция нормальна и лечения не требует."],
["Менструация — отторжение внутреннего слоя матки, если беременность не наступила",TF,0,"Верно: слой готовится к возможной беременности, а без неё отторгается.","Это определение из презентации: утверждение верное."],
["Мышцы растут особенно у девочек, жировая ткань — у мальчиков",TF,1,"Неверно: наоборот, мышцы растут особенно у мальчиков, жировая ткань формируется у девочек.","Перепутано: мышечная масса — у мальчиков, жировая — у девочек."],
["Прыщи — воспаление закупоренных пор из-за избытка себума",TF,0,"Верно: половые гормоны стимулируют сальные железы, избыток себума забивает поры, там размножаются микробы.","Механизм именно такой, утверждение верное."],
["Голос меняется только у мальчиков",TF,1,"Неверно: гортань растёт у обоих полов, просто у мальчиков голос меняется заметнее.","Меняется у обоих: гортань растёт у всех, разница только в заметности."],
["В подростковом возрасте роль сверстников снижается",TF,1,"Неверно: она резко возрастает, друзья влияют на мнение, поведение и самооценку.","Наоборот: влияние сверстников в этом возрасте усиливается."]]},
{i:"🎯",n:"Викторина",d:"Вопросы с 4 вариантами и разбором каждого",t:"Выбери ответ",it:[
["Что НЕ входит в основные этапы созревания?",["Физическое развитие","Половое развитие","Финансовое развитие","Социальное становление"],2,"Основные этапы: физическое, половое, психическое и эмоциональное, социальное. Финансового нет.",["Входит: это рост и строение тела.","Входит: пубертатное развитие.",0,"Входит: формирование личности в обществе."]],
["Что вырабатывают сальные железы, из-за избытка чего появляются прыщи?",["Мелатонин","Себум","Инсулин","Пепсин"],1,"Себум увлажняет и защищает кожу, а при избытке забивает поры.",["Мелатонин вырабатывает шишковидная железа.",0,"Инсулин вырабатывает поджелудочная железа.","Пепсин — фермент желудка."]],
["Что относится к вторичным половым признакам?",["Оволосение и изменение голоса","Частота пульса","Группа крови","Цвет глаз"],0,"Вторичные половые признаки: оволосение, изменение голоса, развитие груди у девочек.",[0,"Пульс отражает работу сердца, не половое созревание.","Группа крови не меняется с возрастом.","Цвет глаз определяет генетика."]],
["Когда ребёнка нужно показать психологу?",["Вырос на 8 см за год","Появились первые прыщи","Говорит, что хочет навредить себе","Спорит о правилах"],2,"Слова о желании навредить себе или другим — тревожный признак. Также повод: проблемы со сном и питанием, постоянная подавленность, чрезмерная агрессия.",["Это обычный скачок роста.","Прыщи — вопрос к дерматологу, не к психологу.",0,"Споры о правилах — часть пубертата. Повод для беспокойства — подавленность, агрессия, проблемы со сном и питанием."]],
["Что помогают выявлять профилактические осмотры?",["Отклонения роста и развития","Только зрение","Группу крови","Ничего"],0,"Осмотры помогают контролировать рост и развитие, выявлять отклонения, корректировать питание и нагрузки, предотвращать анемию, ожирение и болезни опорно-двигательного аппарата.",[0,"Осмотры шире зрения: оценивают рост, питание, опорно-двигательный аппарат.","Группа крови определяется один раз и с развитием не связана.","Они именно для того, чтобы вовремя замечать проблемы."]],
["Что НЕ влияет на соматическое развитие?",["Качество сна","Питание","Цвет обоев","Хронические болезни"],2,"На рост и созревание влияют генетика, питание, активность, экология, болезни, психоэмоциональное состояние, сон и режим.",["Влияет: во сне выделяются гормоны роста, режим важен.","Влияет: рациональное питание и водный режим нужны для роста.",0,"Влияют: хронические болезни тормозят развитие."]]]},
